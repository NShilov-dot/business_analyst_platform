# Standalone frontend: build the SPA image and serve it against some backend.
#
# The SPA is same-origin with the API by design — this nginx proxies /v1 to the
# backend WITHOUT rewriting the path (that alignment is what keeps the BFF session
# cookie and the path-scoped oidc_state cookie on /v1/auth/callback working), so it
# always needs a backend URL:
#
#   BACKEND_UPSTREAM=https://ba-dev.example.com docker compose up -d --build
#
# Two cases this file is deliberately NOT for:
#   - day-to-day UI work → `npm run dev` (HMR on :5173, proxies /v1 to :8000)
#   - the full local stack → the `configs` repo builds this image itself and wires
#     it to the `app` service on the shared compose network
services:
  frontend:
    build: .
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:?set BACKEND_UPSTREAM, e.g. https://ba-dev.example.com}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
